<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THEO5914 — Rhetorical / Communicative Criticism Mind Map</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: white; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 10; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .subtitle { font-size: 0.875rem; color: #6b7280; margin-top: 2px; }
  nav { display: flex; gap: 8px; }
  button { background: white; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 16px; font-size: 0.875rem; cursor: pointer; transition: all 0.15s; }
  button:hover { background: #f3f4f6; }
  button.active { background: #7c3aed; color: white; border-color: #7c3aed; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  .mindmap-container { max-width: 1400px; width: 100%; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
  img { width: 100%; height: auto; display: block; }
  footer { text-align: center; padding: 16px; font-size: 0.75rem; color: #9ca3af; background: white; border-top: 1px solid #e5e7eb; }
  @media (max-width: 640px) { header { flex-direction: column; align-items: flex-start; } h1 { font-size: 1.1rem; } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>THEO5914 — Rhetorical / Communicative Criticism</h1>
      <div class="subtitle">Mind Map · 14 October 2026 Presentation</div>
    </div>
    <nav>
      <button id="btn-master" class="active">Master Mind Map</button>
      <button id="btn-route">Presentation Route</button>
    </nav>
  </header>
  <main>
    <div class="mindmap-container">
      <img id="mindmap" src="EC4pJ.jpg" alt="Master Mind Map">
    </div>
  </main>
  <footer>THEO5914 Methods and Biblical Interpretation · Harry & Tiffany · Visual style matching course mind maps</footer>
  <script>
    const img = document.getElementById('mindmap');
    const btnMaster = document.getElementById('btn-master');
    const btnRoute = document.getElementById('btn-route');
    btnMaster.addEventListener('click', () => { img.src = 'EC4pJ.jpg'; btnMaster.classList.add('active'); btnRoute.classList.remove('active'); });
    btnRoute.addEventListener('click', () => { img.src = 'LIyoI.jpg'; btnRoute.classList.add('active'); btnMaster.classList.remove('active'); });
  </script>
</body>
</html>
